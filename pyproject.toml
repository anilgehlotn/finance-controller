[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-controller"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "faker>=25.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.4",
    "anthropic>=0.40",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
